[project]
name = "tcc"
version = "0.0.1"
description = "Trabalho de conclusão de curso de ciência da computação"

authors = [
    {name = "thiagopls1",email = "thiagopls1@hotmail.com"}
]

license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = ["simpy (>=4.1.2,<5.0.0)"]

[dependency-groups]
dev = [
    "taskipy (>=1.14.1,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.taskipy.tasks]
"run" = "python src/main.py"
"build:article" = "cd ./tcc2 && latexmk -f -pdf tcc.tex"
